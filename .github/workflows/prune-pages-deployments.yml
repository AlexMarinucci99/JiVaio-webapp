name: Prune Pages deployments

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: prune-pages-deployments
  cancel-in-progress: false

jobs:
  prune:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment: 'github-pages', per_page: 100
            });
            deployments.sort ( (a, b) => b.created_at.localeCompare(a.created_at) || b.id - a.id );
            if (deployments.length < 2) return;

            const states = await Promise.all(deployments.map(async deployment => {
              const { data } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 1
              });
              return data[0]?.state;
            }));
            if (states[0] !== 'success' || states.some(state => !state || ['queued', 'pending', 'in_progress', 'waiting'].includes(state))) {
              core.notice('Pulizia rinviata: ultimo deployment non riuscito o deployment in corso.');
              return;
            }
            for (let i = 1; i < deployments.length; i++) {
              const deployment_id = deployments[i].id;
              if (states[i] !== 'inactive') {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id, state: 'inactive', auto_inactive: false
                });
              }
              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id });
              core.info(`Eliminato deployment ${deployment_id}`);
            }
